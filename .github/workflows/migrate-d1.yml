name: D1 Migration (manual)

# Manual-only workflow. This is the ONLY sanctioned path for applying Drizzle
# migrations to the REMOTE D1 database (see AGENTS.md "Database — hard rules").
# Default behavior: generate pending migrations + print a --dry-run diff for
# human review. Set apply_remote=true to actually apply to remote D1.
on:
  workflow_dispatch:
    inputs:
      apply_remote:
        description: 'Apply the generated migration to the REMOTE D1 database. Leave false to only generate + dry-run for review.'
        type: boolean
        required: true
        default: false
      database:
        description: 'D1 database name'
        type: string
        required: false
        default: 'bukoo-db'

concurrency:
  group: migrate-d1
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

permissions:
  contents: read

jobs:
  migrate:
    name: Generate + Review + Apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build @bukoo/db (drizzle schema types)
        run: npm run --workspace=@bukoo/db build

      - name: Generate pending migration (drizzle-kit, local only)
        run: npm run --workspace=apps/api db:generate

      - name: Review — dry-run migration SQL (nothing applied)
        working-directory: apps/api
        run: npx wrangler d1 migrations apply ${{ inputs.database }} --remote --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply to remote D1 (only when confirmed)
        if: inputs.apply_remote == true
        run: npm run --workspace=apps/api db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Reminder — FTS5 rule
        if: always()
        run: |
          echo "⚠️  D1 does NOT support FTS5 DELETE/UPDATE triggers (SQLITE_ERROR 7500)."
          echo "    Keep FTS sync insert-only (see migration 0003_fix_fts5_triggers.sql)."
