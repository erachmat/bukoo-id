name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs for the same ref so pushes don't queue up
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:

  # ── 1. Lint (turbo) ─────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (turbo)
        run: npm run lint

  # ── 2. Type-check (turbo builds @bukoo/db first via dependsOn ^build) ───────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (turbo)
        run: npm run typecheck

  # ── 3. Tests ─────────────────────────────────────────────────────────────────
  # API tests are pure vitest unit tests with mocked D1/R2/AI bindings — no
  # Postgres/Redis/Prisma services needed (legacy stack is decommissioned).
  # Mobile's `test` is a no-op echo; web has no test script (turbo skips it).
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (turbo)
        run: npm run test

  # ── 4. Drizzle schema ↔ migrations drift check (offline) ────────────────────
  db-check:
    name: Drizzle Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check schema vs migrations
        run: npm run --workspace=@bukoo/db db:check
