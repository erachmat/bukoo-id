<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded background -->
  <rect width="512" height="512" rx="128" fill="#0A1A15"/>
  
  <!-- Outer subtle glowing ring -->
  <circle cx="256" cy="256" r="230" stroke="url(#gold_grad)" stroke-width="4" stroke-opacity="0.2" stroke-dasharray="16 8"/>

  <!-- Logo Group -->
  <g transform="translate(16, 16)">
    <!-- Stylized Book Pages forming a 'B' -->
    <!-- Spine of the book (left vertical line) -->
    <path d="M160 110 V370 C160 381 169 390 180 390 H195 C201 390 205 386 205 380 V100 C205 94 201 90 195 90 H180 C169 90 160 99 160 110 Z" fill="url(#gold_grad)" />
    
    <!-- Top page loop of the 'B' (curved paper style) -->
    <path d="M205 120 C230 120 290 120 310 145 C325 163 325 197 310 215 C290 240 230 240 205 240" stroke="url(#gold_grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bottom page loop of the 'B' (curved paper style) -->
    <path d="M205 240 C230 240 300 240 320 265 C335 283 335 317 320 335 C300 360 230 360 205 360" stroke="url(#gold_grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- A glowing bookmark ribbon hanging from the spine in brand teal -->
    <path d="M172 260 V410 L187.5 395 L203 410 V260 H172 Z" fill="url(#teal_grad)" filter="url(#glow)"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="gold_grad" x1="160" y1="90" x2="330" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF0D0" />
      <stop offset="50%" stop-color="#C9952A" />
      <stop offset="100%" stop-color="#8C6212" />
    </linearGradient>
    <linearGradient id="teal_grad" x1="172" y1="260" x2="203" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C9A7" />
      <stop offset="100%" stop-color="#00806A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
</svg>
